name: AI 日报每日更新

on:
  schedule:
    # UTC 02:00 = 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node build/actions-build.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日 AI 日报 $(date -u +%F)"
            git push
          fi

      - name: 推送到微信（Server酱）
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: |
          if [ -z "$PUSH_KEY" ]; then echo "PUSH_KEY 未配置，跳过推送"; exit 0; fi
          TOTAL=$(node -p "require('./build/data.json').items.length")
          curl -sS "https://sctapi.ftqq.com/${PUSH_KEY}.send" \
            --data-urlencode "title=今日 AI 日报已就绪（${TOTAL} 条）" \
            --data-urlencode "desp=点开就看：https://lq2368647453.github.io/ai-daily-briefing/"

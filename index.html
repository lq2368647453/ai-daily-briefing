/* ============================================================
   设计令牌
   ============================================================ */
:root{
  --bg:#f4f6fa;
  --card:#ffffff;
  --ink:#12172b;
  --ink-2:#3c4459;
  --ink-3:#7a839a;
  --line:#e6e9f0;
  --line-2:#eef1f6;
  --radius:16px;
  --sec:#2563eb;
  --sec-bg:#eff6ff;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.14);
  --shadow-hi:0 2px 6px rgba(16,24,40,.06), 0 18px 40px -18px rgba(16,24,40,.26);
  --maxw:1120px;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 14px;}

/* ============================================================
   Hero
   ============================================================ */
.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(1200px 420px at 12% -10%, rgba(124,58,237,.55), transparent 60%),
    radial-gradient(900px 380px at 96% 8%, rgba(14,165,233,.45), transparent 62%),
    linear-gradient(135deg,#241b6b 0%,#3730a3 48%,#1d4ed8 100%);
  color:#fff;
  padding:30px 0 26px;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 78%);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 78%);
}
.hero-inner{position:relative;z-index:1;}
.hero-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.02em;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.26);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.25);}
.hero h1{
  margin:0 0 10px;font-size:clamp(26px,7.4vw,40px);line-height:1.18;font-weight:800;letter-spacing:-.02em;
}
.hero h1 .thin{font-weight:400;opacity:.85;}
.hero-sub{margin:0;color:rgba(255,255,255,.82);font-size:13.5px;line-height:1.7;max-width:46em;}
.hero-sub b{color:#fff;font-weight:600;}

/* 关键数字 */
.hero-stats{display:flex;align-items:flex-end;gap:18px;margin-top:20px;flex-wrap:wrap;}
.big-num{display:flex;align-items:baseline;gap:8px;}
.big-num .n{
  font-size:52px;font-weight:800;line-height:.9;letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff,#c7d2fe);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.big-num .u{font-size:13px;color:rgba(255,255,255,.7);font-weight:500;}

/* 五版块统计 */
.sec-stats{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;
  margin-top:18px;
}
.sec-stat{
  display:block;padding:10px 8px 9px;border-radius:12px;text-align:center;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.18);
  transition:transform .16s ease, background .16s ease;
}
.sec-stat:hover,.sec-stat:active{background:rgba(255,255,255,.2);transform:translateY(-2px);}
.sec-stat .v{display:block;font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em;}
.sec-stat .k{display:block;margin-top:3px;font-size:11px;color:rgba(255,255,255,.78);line-height:1.3;}

/* ============================================================
   锚点导航
   ============================================================ */
.nav{
  position:sticky;top:0;z-index:40;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  display:flex;gap:7px;overflow-x:auto;padding:10px 14px;max-width:var(--maxw);margin:0 auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.nav-inner::-webkit-scrollbar{display:none;}
.nav-pill{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
  color:var(--ink-2);background:#fff;border:1px solid var(--line);
  transition:all .16s ease;
}
.nav-pill .c{width:7px;height:7px;border-radius:50%;background:var(--pc);}
.nav-pill .n{font-size:11.5px;color:var(--ink-3);font-weight:700;}
.nav-pill:hover{border-color:var(--pc);color:var(--pc);}
.nav-pill.on{background:var(--pc);border-color:var(--pc);color:#fff;}
.nav-pill.on .n{color:rgba(255,255,255,.85);}

/* ============================================================
   版块
   ============================================================ */
main{padding:18px 0 8px;}
.section{margin-bottom:26px;scroll-margin-top:64px;}
.sec-head{display:flex;align-items:center;gap:10px;margin:0 2px 12px;}
.sec-bar{width:4px;height:22px;border-radius:3px;background:var(--sec);flex:0 0 auto;}
.sec-title{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;}
.sec-count{
  font-size:11.5px;font-weight:700;color:var(--sec);background:var(--sec-bg);
  padding:2px 9px;border-radius:999px;
}
.sec-line{flex:1;height:1px;background:var(--line);}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:13px;}
.card{
  position:relative;display:flex;flex-direction:column;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 15px 13px;box-shadow:var(--shadow);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi);border-color:#d5dae6;}
.card::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 3px 3px 0;background:var(--sec);opacity:.75;
}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.num{
  flex:0 0 auto;width:26px;height:26px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--sec);background:var(--sec-bg);
}
.card h3{
  margin:0;font-size:15.5px;line-height:1.45;font-weight:700;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.card h3 a{background-image:linear-gradient(var(--sec),var(--sec));background-size:0 1.5px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .2s ease;}
.card h3 a:hover{background-size:100% 1.5px;}

.plain{
  margin:0 0 11px;font-size:13.5px;line-height:1.68;color:var(--ink-2);
  background:var(--sec-bg);border-radius:10px;padding:9px 11px;
}
.card-foot{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:auto;padding-top:10px;border-top:1px dashed var(--line-2);
}
.chip{
  font-size:11.5px;font-weight:600;color:var(--ink-2);
  background:#f2f4f9;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
  max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.time{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.today{
  font-size:10.5px;font-weight:800;color:#fff;background:#ef4444;
  border-radius:5px;padding:1.5px 5px;letter-spacing:.04em;
}
.links{margin-left:auto;display:flex;align-items:center;gap:10px;}
.links a{font-size:12.5px;font-weight:700;color:var(--sec);white-space:nowrap;}
.links a.alt{font-weight:600;color:var(--ink-3);}
.links a:hover{text-decoration:underline;}

.empty{
  padding:22px;text-align:center;color:var(--ink-3);font-size:13.5px;
  border:1px dashed var(--line);border-radius:var(--radius);background:#fbfcfe;
}

/* ============================================================
   每周专题（预留版块）
   ============================================================ */
.weekly{
  background:linear-gradient(135deg,#fffbeb,#fef3c7 60%,#ffffff);
  border:1px solid #fde68a;border-radius:var(--radius);
  padding:18px 16px;margin-bottom:26px;box-shadow:var(--shadow);
}
.weekly-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.weekly-head .tag{
  font-size:11px;font-weight:800;color:#92400e;background:#fde68a;
  padding:2px 8px;border-radius:6px;letter-spacing:.04em;
}
.weekly h2{margin:0;font-size:17.5px;font-weight:800;}
.weekly .period{margin:0 0 12px;font-size:12.5px;color:#a16207;}
.weekly-block{margin-bottom:12px;}
.weekly-block:last-child{margin-bottom:0;}
.weekly-block h4{margin:0 0 6px;font-size:13.5px;font-weight:800;color:#78350f;}
.weekly-block p{margin:0;font-size:13.5px;line-height:1.72;color:#4a3410;}
.weekly-block ul{margin:0;padding-left:18px;}
.weekly-block li{font-size:13.5px;line-height:1.72;color:#4a3410;margin-bottom:4px;}

/* ============================================================
   页脚
   ============================================================ */
footer{
  margin-top:8px;padding:22px 0 30px;border-top:1px solid var(--line);
  color:var(--ink-3);font-size:12.5px;line-height:1.8;
}
.foot-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--ink-2);font-size:13.5px;}
.foot-main .src{
  color:#fff;background:var(--ink);border-radius:6px;padding:1px 7px;font-size:12px;
}
.foot-note{margin:6px 0 0;}
.foot-note a{color:var(--sec);text-decoration:underline;text-underline-offset:2px;}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:720px){
  .sec-stats{grid-template-columns:repeat(3,minmax(0,1fr));}
  .grid{grid-template-columns:1fr;}
  .hero{padding:24px 0 22px;}
  .big-num .n{font-size:44px;}
}
@media (max-width:380px){
  .sec-stats{grid-template-columns:repeat(2,minmax(0,1fr));}
  .chip{max-width:120px;}
}

/* 截图 / 打印友好 */
@media print{
  body{background:#fff;}
  .nav{display:none;}
  .card,.weekly{break-inside:avoid;page-break-inside:avoid;box-shadow:none;}
  .hero{background:#1e1b4b !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>

const REPORT = __DATA__.report;
const SECTIONS = __DATA__.sections;
const ITEMS = __DATA__.items;
const WEEKLY_INSIGHT = __DATA__.weekly || [];

/* ============================================================================
 * 3. 渲染层（一般无需改动）
 * ========================================================================== */

const $ = (s, r = document) => r.querySelector(s);

/** 转义，防止数据里的特殊字符破坏结构 */
function esc(str){
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/** ISO 时间 -> 北京时间 Date（用 UTC 字段读取即为北京时间） */
function toBeijing(iso){
  return new Date(new Date(iso).getTime() + 8 * 3600 * 1000);
}
function pad2(n){ return String(n).padStart(2, "0"); }

/** 北京时间 -> 人话格式：今天/昨天/前天 HH:MM，更早则 M月D日 HH:MM */
function humanTime(iso){
  const b = toBeijing(iso);
  const ymd = b.getUTCFullYear() + "-" + pad2(b.getUTCMonth() + 1) + "-" + pad2(b.getUTCDate());
  const diff = Math.round(
    (Date.parse(REPORT.date + "T00:00:00Z") - Date.parse(ymd + "T00:00:00Z")) / 86400000
  );
  let day;
  if (diff === 0)       day = "今天";
  else if (diff === 1)  day = "昨天";
  else if (diff === 2)  day = "前天";
  else                  day = (b.getUTCMonth() + 1) + "月" + b.getUTCDate() + "日";
  return day + " " + pad2(b.getUTCHours()) + ":" + pad2(b.getUTCMinutes());
}

/** 是否属于报告当日（用于打「今日」标） */
function isReportDay(iso){
  const b = toBeijing(iso);
  const ymd = b.getUTCFullYear() + "-" + pad2(b.getUTCMonth() + 1) + "-" + pad2(b.getUTCDate());
  return ymd === REPORT.date;
}

/** 按 SECTIONS 顺序分组，保持原始数据相对顺序 */
function groupItems(){
  return SECTIONS.map(s => ({
    sec: s,
    items: ITEMS.filter(i => i.sec === s.id)
  }));
}

/** 卡片模板 */
function cardHTML(item, no){
  const s = SECTIONS.find(x => x.id === item.sec) || SECTIONS[0];
  const main = item.aihot || item.original || "#";
  const showAlt = item.original && item.original !== main;
  return `
  <article class="card" style="--sec:${s.color};--sec-bg:${s.bg}">
    <div class="card-top">
      <span class="num">${no}</span>
      <h3><a href="${esc(main)}" target="_blank" rel="noopener noreferrer">${esc(item.title)}</a></h3>
    </div>
    <p class="plain">${esc(item.plain)}</p>
    <div class="card-foot">
      <span class="chip" title="${esc(item.source)}">${esc(item.source)}</span>
      <span class="time">${esc(humanTime(item.time))}</span>
      ${isReportDay(item.time) ? '<span class="today">今日</span>' : ""}
      <span class="links">
        ${showAlt ? `<a class="alt" href="${esc(item.original)}" target="_blank" rel="noopener noreferrer">原出处 ↗</a>` : ""}
        <a href="${esc(main)}" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>
      </span>
    </div>
  </article>`;
}

/** 版块模板 */
function sectionHTML(group, startNo){
  const { sec, items } = group;
  const body = items.length
    ? `<div class="grid">${items.map((it, i) => cardHTML(it, startNo + i)).join("")}</div>`
    : `<div class="empty">本版块今日暂无精选条目</div>`;
  return `
  <section class="section" id="${sec.id}" style="--sec:${sec.color};--sec-bg:${sec.bg}">
    <div class="sec-head">
      <span class="sec-bar"></span>
      <h2 class="sec-title">${esc(sec.label)}</h2>
      <span class="sec-count">${items.length} 条</span>
      <span class="sec-line"></span>
    </div>
    ${body}
  </section>`;
}

/** 每周专题模板 */
function weeklyHTML(list){
  if (!list || !list.length) return "";
  return list.map(w => `
  <section class="weekly">
    <div class="weekly-head">
      <span class="tag">每周专题</span>
      <h2>${esc(w.title || "事件分析与未来发展走向")}</h2>
    </div>
    <p class="period">${esc(w.period || "")}</p>
    ${w.recap ? `<div class="weekly-block"><h4>事件回顾</h4><p>${esc(w.recap)}</p></div>` : ""}
    ${(w.points && w.points.length)
      ? `<div class="weekly-block"><h4>要点拆解</h4><ul>${w.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`
      : ""}
    ${w.outlook ? `<div class="weekly-block"><h4>未来发展走向</h4><p>${esc(w.outlook)}</p></div>` : ""}
  </section>`).join("");
}

/** 主渲染 */
function render(){
  const groups = groupItems();
  const total = ITEMS.length;

  // Hero
  const [Y, M, D] = REPORT.date.split("-");
  $("#heroDate").textContent = `${Y}年${Number(M)}月${Number(D)}日`;
  $("#heroWeekday").textContent = REPORT.weekday;
  $("#heroScope").innerHTML = esc(REPORT.scope);
  $("#totalNum").textContent = total;

  $("#secStats").innerHTML = groups.map(g => `
    <a class="sec-stat" href="#${g.sec.id}">
      <span class="v">${g.items.length}</span>
      <span class="k">${esc(g.sec.label)}</span>
    </a>`).join("");

  // 锚点导航
  $("#navInner").innerHTML = groups.map(g => `
    <a class="nav-pill" href="#${g.sec.id}" data-target="${g.sec.id}" style="--pc:${g.sec.color}">
      <span class="c"></span>${esc(g.sec.short)}<span class="n">${g.items.length}</span>
    </a>`).join("");

  // 正文（全局连续编号）
  let no = 1;
  let html = groups.map(g => {
    const h = sectionHTML(g, no);
    no += g.items.length;
    return h;
  }).join("");

  html += weeklyHTML(WEEKLY_INSIGHT);
  $("#content").innerHTML = html;

  // 页脚
  $("#footTotal").textContent = total;
  $("#footNote").innerHTML =
    `数据来源：<a href="${esc(REPORT.sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(REPORT.sourceName)} 日报 ${esc(REPORT.date)}</a>　·　时间为北京时间（UTC+8）　·　摘要为大白话改写，细节以原文为准。`;

  bindNavScroll();
}

/** 导航高亮：滚到哪个版块就亮哪个 */
function bindNavScroll(){
  const pills = Array.from(document.querySelectorAll(".nav-pill"));
  const secs = SECTIONS.map(s => document.getElementById(s.id)).filter(Boolean);
  if (!pills.length || !secs.length) return;

  const setOn = id => pills.forEach(p => p.classList.toggle("on", p.dataset.target === id));

  const io = new IntersectionObserver(entries => {
    const visible = entries.filter(e => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (visible) setOn(visible.target.id);
  }, { rootMargin: "-70px 0px -65% 0px", threshold: 0 });

  secs.forEach(s => io.observe(s));
  setOn(secs[0].id);
}

document.addEventListener("DOMContentLoaded", render);
</script>
